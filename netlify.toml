[build]
  command = "git clone --depth 1 --branch 3.32.8 https://github.com/flutter/flutter.git $HOME/flutter && $HOME/flutter/bin/flutter config --enable-web && $HOME/flutter/bin/flutter pub get && $HOME/flutter/bin/flutter build web --release --pwa-strategy=none"
  publish = "build/web"

# Always serve the newest version of the app (no stale cached copy)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200